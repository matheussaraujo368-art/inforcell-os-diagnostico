# Publicação no Render: um único serviço entrega a API e as telas.
# O banco MySQL fica fora do Render; a DATABASE_URL é informada no painel.
services:
  - type: web
    name: inforcell-os
    runtime: node
    plan: free
    region: virginia
    branch: main
    buildCommand: cd backend && npm ci --include=dev && npx prisma generate && npm run build
    startCommand: cd backend && npx prisma migrate deploy && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGIN
        value: https://rafaelpontara.github.io,https://inforcell-os.onrender.com
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-5-5
